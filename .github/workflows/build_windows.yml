name: Build raylib - Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/windows.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write  # Required for actions/upload-release-asset to upload release asset
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
        - compiler: mingw-w64
          ARCH: "i686"
          MINGW_BIN: "C:\\msys64\\mingw32\\bin"
          WINDRES_ARCH: pe-i386
          ziptarget: "win32"
        - compiler: mingw-w64
          ARCH: "x86_64"
          MINGW_BIN: "C:\\msys64\\mingw64\\bin"
          WINDRES_ARCH: pe-x86-64
          ziptarget: "win64"

    env:
      RELEASE_NAME: raylib-dev_${{ matrix.ziptarget }}_${{ matrix.compiler }}

    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Setup Release Version
      run: |
        echo "RELEASE_NAME=raylib-${{ github.event.release.tag_name }}_${{ matrix.ziptarget }}_${{ matrix.compiler }}" >> $GITHUB_ENV
      shell: bash
      if: github.event_name == 'release' && github.event.action == 'published'

    - name: Setup Environment
      shell: cmd
      run: |
        mkdir build\${{ env.RELEASE_NAME }}\include
        mkdir build\${{ env.RELEASE_NAME }}\lib

    # Install SDL3 via the preinstalled MSYS2 for the MinGW toolchain.
    # SDL is an external library required by the PLATFORM=SDL backend.
    # CMake's LibraryConfigurations.cmake prefers SDL3 and falls back to SDL2.
    - name: Install SDL (MinGW via MSYS2)
      shell: cmd
      run: |
        set PATH=C:\msys64\usr\bin;%PATH%
        pacman -S --noconfirm --needed mingw-w64-${{ matrix.ARCH }}-SDL3 || pacman -S --noconfirm --needed mingw-w64-${{ matrix.ARCH }}-SDL2

    - name: Build Library (MinGW-w64)
      shell: cmd
      run: |
        set PATH=${{ matrix.MINGW_BIN }};%PATH%
        ${{ matrix.ARCH }}-w64-mingw32-gcc.exe --version
        windres.exe --version

        :: Static library
        :: NOTE: BUILD_EXAMPLES=OFF because the CI only ships the library, not example binaries.
        :: NOTE: Output goes to build/static/raylib/ because the top-level CMakeLists uses
        ::       add_subdirectory(src raylib), NOT build/static/src/.
        cmake -B build\static -G "MinGW Makefiles" ^
          -DPLATFORM=SDL -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_C_COMPILER=${{ matrix.ARCH }}-w64-mingw32-gcc.exe
        cmake --build build\static --config Release
        copy /Y .\build\static\raylib\libraylib.a .\build\${{ env.RELEASE_NAME }}\lib\libraylib.a

        :: Shared library
        :: NOTE: CMake does not link the DLL resource file (raylib.dll.rc) automatically,
        :: the resulting DLL will lack version info / icon, but functions identically.
        :: NOTE: SDL is statically linked into raylib (via SDL3::SDL3-static in
        ::       cmake/LibraryConfigurations.cmake), so no SDL3.dll is shipped.
        cmake -B build\shared -G "MinGW Makefiles" ^
          -DPLATFORM=SDL -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_C_COMPILER=${{ matrix.ARCH }}-w64-mingw32-gcc.exe
        cmake --build build\shared --config Release
        copy /Y .\build\shared\raylib\libraylib.dll     .\build\${{ env.RELEASE_NAME }}\lib\raylib.dll
        copy /Y .\build\shared\raylib\libraylib.dll.a   .\build\${{ env.RELEASE_NAME }}\lib\libraylibdll.a

    - name: Generate Artifacts
      shell: cmd
      run: |
        copy /Y .\src\raylib.h  .\build\${{ env.RELEASE_NAME }}\include\raylib.h
        copy /Y .\src\raymath.h .\build\${{ env.RELEASE_NAME }}\include\raymath.h
        copy /Y .\src\rlgl.h    .\build\${{ env.RELEASE_NAME }}\include\rlgl.h
        copy /Y .\src\rcamera.h .\build\${{ env.RELEASE_NAME }}\include\rcamera.h
        copy /Y .\CHANGELOG     .\build\${{ env.RELEASE_NAME }}\CHANGELOG
        copy /Y .\README.md     .\build\${{ env.RELEASE_NAME }}\README.md
        copy /Y .\LICENSE       .\build\${{ env.RELEASE_NAME }}\LICENSE
        cd build
        dir ${{ env.RELEASE_NAME }}\lib
        7z a .\${{ env.RELEASE_NAME }}.zip .\${{ env.RELEASE_NAME }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.RELEASE_NAME }}
        path: |
          ./build/${{ env.RELEASE_NAME }}
          !./build/${{ env.RELEASE_NAME }}.zip

    - name: Upload Artifact to Release
      uses: softprops/action-gh-release@v3
      with:
        files: ./build/${{ env.RELEASE_NAME }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: github.event_name == 'release' && github.event.action == 'published'
