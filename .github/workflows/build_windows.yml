name: Build raylib - Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/windows.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write  # Required for actions/upload-release-asset to upload release asset
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        compiler: [mingw-w64, msvc16]
        ziptarget: [ win32, win64, winarm64 ]
        include:
        - compiler: mingw-w64
          ARCH: "i686"
          WINDRES_ARCH: pe-i386
          ziptarget: "win32"
        - compiler: mingw-w64
          ARCH: "x86_64"
          WINDRES_ARCH: pe-x86-64
          ziptarget: "win64"
        - compiler: msvc16
          ARCH: "x86"
          VSARCHPATH: "Win32"
          CMAKE_VS_ARCH: "Win32"
          VCPKG_TRIPLET: "x86-windows"
          ziptarget: "win32"
        - compiler: msvc16
          ARCH: "x64"
          VSARCHPATH: "x64"
          CMAKE_VS_ARCH: "x64"
          VCPKG_TRIPLET: "x64-windows"
          ziptarget: "win64"
        - compiler: msvc16
          ARCH: "ARM64"
          VSARCHPATH: "ARM64"
          CMAKE_VS_ARCH: "ARM64"
          VCPKG_TRIPLET: "arm64-windows"
          ziptarget: "winarm64"
        exclude:
          - compiler: mingw-w64
            ziptarget: winarm64 # We don't build arm64 with mingw-w64 yet

    env:
      RELEASE_NAME: raylib-dev_${{ matrix.ziptarget }}_${{ matrix.compiler }}
      GNUTARGET: default

    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Setup Release Version
      run: |
        echo "RELEASE_NAME=raylib-${{ github.event.release.tag_name }}_${{ matrix.ziptarget }}_${{ matrix.compiler }}" >> $GITHUB_ENV
      shell: bash
      if: github.event_name == 'release' && github.event.action == 'published'

    - name: Setup Environment
      run: |
        dir
        mkdir build
        cd build
        mkdir ${{ env.RELEASE_NAME }}
        cd ${{ env.RELEASE_NAME }}
        mkdir include
        mkdir lib
        cd ../../../raylib

    # Setup MSBuild.exe path if required
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
      if: matrix.compiler == 'msvc16'

    # Install SDL3 via vcpkg for the MSVC toolchain.
    # SDL is an external library required by the PLATFORM=SDL backend.
    # CMake's LibraryConfigurations.cmake prefers SDL3 and falls back to SDL2.
    - name: Install SDL (MSVC via vcpkg)
      shell: powershell
      run: |
        & "$env:VCPKG_ROOT\vcpkg.exe" install sdl3:${{ matrix.VCPKG_TRIPLET }}
      if: matrix.compiler == 'msvc16'

    # Install SDL3 via the preinstalled MSYS2 for the MinGW toolchain.
    # Prefer SDL3, fall back to SDL2 if the package is unavailable.
    - name: Install SDL (MinGW via MSYS2)
      shell: cmd
      run: |
        set PATH=C:\msys64\usr\bin;%PATH%
        pacman -S --noconfirm --needed mingw-w64-${{ matrix.ARCH }}-SDL3 || pacman -S --noconfirm --needed mingw-w64-${{ matrix.ARCH }}-SDL2
      if: matrix.compiler == 'mingw-w64'

    - name: Build Library (MinGW-w64 32bit)
      run: |
        set PATH=C:\msys64\mingw64\bin;C:\msys64\mingw32\bin;%PATH%
        x86_64-w64-mingw32-gcc.exe --version
        windres.exe --version
        cmake -B build/static -G "MinGW Makefiles" -DPLATFORM=SDL -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc.exe -DCMAKE_C_FLAGS="-m32" ^
          -DCMAKE_EXE_LINKER_FLAGS="-m32" -DCMAKE_LIBRARY_PATH="C:/msys64/mingw32/lib"
        cmake --build build/static --config Release
        copy /Y .\build\static\src\libraylib.a .\build\${{ env.RELEASE_NAME }}\lib\libraylib.a
        cd ..
      shell: cmd
      if: |
        matrix.compiler == 'mingw-w64' &&
        matrix.arch == 'i686'

    - name: Build Library (MinGW-w64 64bit)
      run: |
        set PATH=C:\msys64\mingw64\bin;%PATH%
        ${{ matrix.ARCH }}-w64-mingw32-gcc.exe --version
        windres.exe --version
        :: Static library
        cmake -B build/static -G "MinGW Makefiles" -DPLATFORM=SDL -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_C_COMPILER=${{ matrix.ARCH }}-w64-mingw32-gcc.exe
        cmake --build build/static --config Release
        copy /Y .\build\static\src\libraylib.a .\build\${{ env.RELEASE_NAME }}\lib\libraylib.a
        :: Shared library
        :: NOTE: CMake does not link the DLL resource file (raylib.dll.rc) automatically,
        :: the resulting DLL will lack version info / icon, but functions identically.
        cmake -B build/shared -G "MinGW Makefiles" -DPLATFORM=SDL -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_C_COMPILER=${{ matrix.ARCH }}-w64-mingw32-gcc.exe
        cmake --build build/shared --config Release
        copy /Y .\build\shared\src\libraylib.dll .\build\${{ env.RELEASE_NAME }}\lib\raylib.dll
        copy /Y .\build\shared\src\libraylib.dll.a .\build\${{ env.RELEASE_NAME }}\lib\libraylibdll.a
        cd ..
      shell: cmd
      if: |
        matrix.compiler == 'mingw-w64' &&
        matrix.arch == 'x86_64'

    - name: Build Library (MSVC16)
      run: |
        :: Static library
        cmake -B build/static -G "Visual Studio 17 2022" -A ${{ matrix.CMAKE_VS_ARCH }} -DPLATFORM=SDL -DBUILD_SHARED_LIBS=OFF ^
          -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake"
        cmake --build build/static --config Release
        copy /Y .\build\static\src\Release\raylib.lib .\build\${{ env.RELEASE_NAME }}\lib\raylib.lib
        :: Shared library
        cmake -B build/shared -G "Visual Studio 17 2022" -A ${{ matrix.CMAKE_VS_ARCH }} -DPLATFORM=SDL -DBUILD_SHARED_LIBS=ON ^
          -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake"
        cmake --build build/shared --config Release
        copy /Y .\build\shared\src\Release\raylib.dll .\build\${{ env.RELEASE_NAME }}\lib\raylib.dll
        copy /Y .\build\shared\src\Release\raylib.lib .\build\${{ env.RELEASE_NAME }}\lib\raylibdll.lib
        cd ../..
      shell: cmd
      if: matrix.compiler == 'msvc16'

    - name: Generate Artifacts
      run: |
        copy /Y .\src\raylib.h .\build\${{ env.RELEASE_NAME }}\include\raylib.h
        copy /Y .\src\raymath.h .\build\${{ env.RELEASE_NAME }}\include\raymath.h
        copy /Y .\src\rlgl.h .\build\${{ env.RELEASE_NAME }}\include\rlgl.h
        copy /Y .\CHANGELOG .\build\${{ env.RELEASE_NAME }}\CHANGELOG
        copy /Y .\README.md .\build\${{ env.RELEASE_NAME }}\README.md
        copy /Y .\LICENSE .\build\${{ env.RELEASE_NAME }}\LICENSE
        cd build
        7z a ./${{ env.RELEASE_NAME }}.zip ./${{ env.RELEASE_NAME }}
        dir
      shell: cmd

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.RELEASE_NAME }}
        path: |
          ./build/${{ env.RELEASE_NAME }}
          !./build/${{ env.RELEASE_NAME }}.zip

    - name: Upload Artifact to Release
      uses: softprops/action-gh-release@v3
      with:
        files: ./build/${{ env.RELEASE_NAME }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: github.event_name == 'release' && github.event.action == 'published'
