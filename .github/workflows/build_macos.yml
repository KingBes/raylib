name: Build raylib - macOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/macos.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write  # Required for actions/upload-release-asset to upload release asset
    runs-on: macos-latest

    env:
      RELEASE_NAME: raylib-dev_macos

    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Setup Release Version
      run: |
        echo "RELEASE_NAME=raylib-${{ github.event.release.tag_name }}_macos" >> $GITHUB_ENV
      shell: bash
      if: github.event_name == 'release' && github.event.action == 'published'

    - name: Setup Environment
      run: |
        # SDL is an external library required by the PLATFORM=SDL backend.
        # Prefer SDL3, fall back to SDL2 if the formula is unavailable.
        # CMake's LibraryConfigurations.cmake mirrors the same SDL3 -> SDL2 fallback.
        if brew install sdl3; then
          echo "SDL_PACKAGE=SDL3" >> $GITHUB_ENV
        else
          brew install sdl2
          echo "SDL_PACKAGE=SDL2" >> $GITHUB_ENV
        fi
        mkdir -p build/${{ env.RELEASE_NAME }}/include
        mkdir -p build/${{ env.RELEASE_NAME }}/lib

    # Generating static + shared library, note that i386 architecture is deprecated
    # Defining GL_SILENCE_DEPRECATION because OpenGL is deprecated on macOS
    - name: Build Library
      run: |
        clang --version

        # Extract version numbers from src/CMakeLists.txt
        # Lines look like: set(PROJECT_VERSION 6.0.0)  set(API_VERSION 600)
        RAYLIB_API_VERSION=$(awk '/^set\(API_VERSION/ { gsub(/[^0-9]/,"",$2); print $2; exit }' src/CMakeLists.txt)
        RAYLIB_VERSION=$(awk '/^set\(PROJECT_VERSION/ { gsub(/[")]/,"",$2); print $2; exit }' src/CMakeLists.txt)
        echo "RAYLIB_API_VERSION=${RAYLIB_API_VERSION}" >> $GITHUB_ENV
        echo "RAYLIB_VERSION=${RAYLIB_VERSION}" >> $GITHUB_ENV

        # Build raylib x86_64 static (deployment target 10.12)
        cmake -B build/x86_64_static -S . -DPLATFORM=SDL -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.12 \
          -DCMAKE_C_FLAGS="-DGL_SILENCE_DEPRECATION"
        cmake --build build/x86_64_static --config Release
        cp -v build/x86_64_static/src/libraylib.a /tmp/libraylib_x86_64.a

        # Build raylib arm64 static (deployment target 11.0)
        cmake -B build/arm64_static -S . -DPLATFORM=SDL -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DCMAKE_C_FLAGS="-DGL_SILENCE_DEPRECATION"
        cmake --build build/arm64_static --config Release
        cp -v build/arm64_static/src/libraylib.a /tmp/libraylib_arm64.a

        # Join x86_64 and arm64 static
        lipo -create -output build/${{ env.RELEASE_NAME }}/lib/libraylib.a /tmp/libraylib_x86_64.a /tmp/libraylib_arm64.a

        # Build raylib x86_64 dynamic (deployment target 10.12)
        cmake -B build/x86_64_shared -S . -DPLATFORM=SDL -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.12 \
          -DCMAKE_C_FLAGS="-DGL_SILENCE_DEPRECATION" \
          -DCMAKE_INSTALL_NAME_DIR=@rpath \
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
        cmake --build build/x86_64_shared --config Release
        cp -v build/x86_64_shared/src/libraylib.${RAYLIB_VERSION}.dylib /tmp/libraylib_x86_64.${RAYLIB_VERSION}.dylib

        # Build raylib arm64 dynamic (deployment target 11.0)
        cmake -B build/arm64_shared -S . -DPLATFORM=SDL -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DCMAKE_C_FLAGS="-DGL_SILENCE_DEPRECATION" \
          -DCMAKE_INSTALL_NAME_DIR=@rpath \
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
        cmake --build build/arm64_shared --config Release
        cp -v build/arm64_shared/src/libraylib.${RAYLIB_VERSION}.dylib /tmp/libraylib_arm64.${RAYLIB_VERSION}.dylib

        # Join x86_64 and arm64 dynamic
        lipo -create -output build/${{ env.RELEASE_NAME }}/lib/libraylib.${RAYLIB_VERSION}.dylib /tmp/libraylib_x86_64.${RAYLIB_VERSION}.dylib /tmp/libraylib_arm64.${RAYLIB_VERSION}.dylib
        install_name_tool -id @rpath/libraylib.${RAYLIB_API_VERSION}.dylib build/${{ env.RELEASE_NAME }}/lib/libraylib.${RAYLIB_VERSION}.dylib
        ln -sv libraylib.${RAYLIB_VERSION}.dylib build/${{ env.RELEASE_NAME }}/lib/libraylib.dylib
        ln -sv libraylib.${RAYLIB_VERSION}.dylib build/${{ env.RELEASE_NAME }}/lib/libraylib.${RAYLIB_API_VERSION}.dylib

    - name: Generate Artifacts
      run: |
        cp -v ./src/raylib.h ./build/${{ env.RELEASE_NAME }}/include
        cp -v ./src/raymath.h ./build/${{ env.RELEASE_NAME }}/include
        cp -v ./src/rlgl.h ./build/${{ env.RELEASE_NAME }}/include
        cp -v ./CHANGELOG ./build/${{ env.RELEASE_NAME }}/CHANGELOG
        cp -v ./README.md ./build/${{ env.RELEASE_NAME }}/README.md
        cp -v ./LICENSE ./build/${{ env.RELEASE_NAME }}/LICENSE
        cd build
        tar -czvf ${{ env.RELEASE_NAME }}.tar.gz ${{ env.RELEASE_NAME }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.RELEASE_NAME }}
        path: |
          ./build/${{ env.RELEASE_NAME }}
          !./build/${{ env.RELEASE_NAME }}.tar.gz

    - name: Upload Artifact to Release
      uses: softprops/action-gh-release@v3
      with:
        files: ./build/${{ env.RELEASE_NAME }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: github.event_name == 'release' && github.event.action == 'published'
